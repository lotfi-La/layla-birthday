<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Layla's Birthday Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Playfair+Display:ital,wght@1,600;1,800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#050505;
  --wine:#5c0f1a;
  --wine-bright:#8a1a2b;
  --gold:#c9a45c;
  --gold-light:#ecd9a8;
  --cream:#f3ece0;
  --vh:1vh;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0;
  width:100%; height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:var(--bg);
  color:var(--cream);
  font-family:'Cairo',sans-serif;
}

body{
  position:fixed;
  inset:0;
  height:100vh;
  height:calc(var(--vh,1vh) * 100);
  height:100dvh;
  background:
    radial-gradient(ellipse 60% 40% at 18% 15%, rgba(138,26,43,.30), transparent 60%),
    radial-gradient(ellipse 50% 35% at 85% 20%, rgba(201,164,92,.14), transparent 60%),
    radial-gradient(ellipse 70% 45% at 50% 100%, rgba(92,15,26,.35), transparent 65%),
    var(--bg);
}

button,input{ font-family:inherit; }
button{ -webkit-appearance:none; appearance:none; }

/* ================= Stage viewport / track ================= */
#stagesViewport{
  position:relative;
  width:100%;
  height:100vh;
  height:calc(var(--vh,1vh) * 100);
  height:100dvh;
  overflow:hidden;
}
#stagesTrack{
  display:flex;
  flex-direction:column;
  width:100%;
  transform:translateY(0);
  transition:transform 1.15s cubic-bezier(.65,0,.35,1);
}
#stagesTrack.to-stage3{
  transform:translateY(-100vh);
  transform:translateY(calc(var(--vh,1vh) * -100));
  transform:translateY(-100dvh);
}
.stage{
  position:relative;
  width:100%;
  height:100vh;
  height:calc(var(--vh,1vh) * 100);
  height:100dvh;
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* ================= Intro ================= */
#introScreen{
  position:fixed; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  padding-top:max(24px, env(safe-area-inset-top));
  padding-bottom:max(24px, env(safe-area-inset-bottom));
  transition:opacity .9s ease, transform .9s ease;
}
#introScreen.intro-hide{ opacity:0; transform:scale(1.04); pointer-events:none; }

.intro-card{
  position:relative;
  z-index:2;
  transition:opacity .5s ease;
  text-align:center;
  padding:46px 30px;
  max-width:380px;
  width:100%;
  border:1px solid rgba(201,164,92,.32);
  background:linear-gradient(165deg, rgba(30,10,12,.55), rgba(5,5,5,.9));
  box-shadow:0 0 70px rgba(201,164,92,.07), inset 0 0 50px rgba(92,15,26,.15);
}
.intro-card::before,.intro-card::after{
  content:''; position:absolute; width:22px; height:22px;
  border:1px solid var(--gold); opacity:.55;
}
.intro-card::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
.intro-card::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
.intro-card.card-hide{ opacity:0; pointer-events:none; }

#welcomeVideo{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  opacity:0;
  z-index:1;
  transition:opacity .6s ease;
  pointer-events:none;
}
#welcomeVideo.video-visible{ opacity:1; }

.intro-title{
  font-family:'Playfair Display', serif;
  font-style:italic;
  font-weight:700;
  font-size:1.7rem;
  line-height:1.4;
  margin:0 0 36px;
  background:linear-gradient(180deg, var(--cream) 15%, var(--gold-light) 70%, var(--gold) 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}

.start-btn{
  font-size:.98rem;
  padding:15px 30px;
  border:1px solid var(--gold);
  background:linear-gradient(135deg, rgba(201,164,92,.16), rgba(201,164,92,.04));
  color:var(--gold-light);
  cursor:pointer;
  letter-spacing:.02em;
  touch-action:manipulation;
  transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
  display:inline-flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:9px;
}
.start-btn .divider{ opacity:.5; }
.start-btn:active{
  transform:scale(.96);
  box-shadow:0 0 26px rgba(201,164,92,.4);
  background:linear-gradient(135deg, rgba(201,164,92,.28), rgba(201,164,92,.08));
}
.start-btn:focus-visible, .wish-btn:focus-visible, .wish-input:focus-visible{
  outline:2px solid var(--gold-light); outline-offset:3px;
}

/* ================= Stage 2: garden ================= */
.instruction-text{
  position:absolute;
  top:9%;
  top:max(9%, calc(env(safe-area-inset-top) + 20px));
  left:0; right:0;
  text-align:center;
  font-size:1.05rem;
  color:rgba(243,236,224,.88);
  text-shadow:0 2px 14px rgba(0,0,0,.9);
  z-index:5;
  padding:0 24px;
  pointer-events:none;
}

canvas#flowerCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; }
canvas#flowerCanvas3D{ position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
#gardenLayer{ position:absolute; inset:0; pointer-events:none; z-index:6; }

.tap-text{
  position:absolute;
  max-width:min(78vw, 320px);
  text-align:center;
  font-weight:600;
  font-size:1.05rem;
  line-height:1.5;
  color:var(--gold-light);
  text-shadow:0 2px 16px rgba(0,0,0,.95);
  pointer-events:none;
  transform:translate(-50%,-100%);
}

/* ================= Stage 3 ================= */
#stage3{ padding:0 20px; }
.titles-block{ text-align:center; margin-bottom:9vh; }
.title-happy{
  font-family:'Cinzel', serif;
  font-weight:700;
  font-size:clamp(1.6rem, 7.5vw, 2.4rem);
  letter-spacing:.15em;
  color:var(--cream);
  margin:0 0 8px;
  text-shadow:0 0 30px rgba(201,164,92,.35);
}
.title-name{
  font-family:'Playfair Display', serif;
  font-style:italic;
  font-weight:800;
  font-size:clamp(2.6rem, 14vw, 4.2rem);
  margin:0;
  background:linear-gradient(180deg, var(--gold-light) 25%, var(--wine-bright) 135%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 24px rgba(92,15,26,.5));
}

.substage{ display:flex; flex-direction:column; align-items:center; width:100%; max-width:340px; }

#wishStage{ transition:opacity .5s ease, transform .5s ease; }
#wishStage.substage-hide{ opacity:0; transform:translateY(-14px) scale(1.02); pointer-events:none; }

.wish-form{ display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; }
.wish-input{
  width:100%;
  padding:14px 18px;
  border:none;
  border-bottom:2px solid var(--gold);
  background:rgba(255,255,255,.04);
  color:var(--cream);
  text-align:center;
  font-size:1rem;
  outline:none;
  transition:border-color .25s ease, background .25s ease;
}
.wish-input::placeholder{ color:rgba(243,236,224,.4); }
.wish-input:focus{ border-color:var(--gold-light); background:rgba(201,164,92,.08); }

.wish-btn{
  background:linear-gradient(135deg, var(--wine), var(--wine-bright));
  color:var(--gold-light);
  border:1px solid rgba(201,164,92,.5);
  padding:12px 30px;
  font-weight:700;
  font-size:.95rem;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:0 6px 24px rgba(92,15,26,.4);
  transition:transform .2s ease, box-shadow .2s ease;
}
.wish-btn:active{ transform:scale(.96); }

#cakeStage{ display:none; opacity:0; transition:opacity .5s ease; touch-action:manipulation; }
#cakeStage.substage-show{ opacity:1; }

.cake-3d-wrapper{ perspective:1000px; }
.cake-3d-inner{
  width:min(66vw, 260px);
  transform-style:preserve-3d;
  transform:rotateY(-70deg) translateZ(-260px) scale(.5);
  opacity:0;
  transition:transform 1.15s cubic-bezier(.16,.84,.44,1), opacity 1.15s ease;
}
.cake-3d-inner.cake-in{ transform:rotateY(0) translateZ(0) scale(1); opacity:1; }
.cake-svg{ width:100%; height:auto; display:block; }

.flame{
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:flicker 1.7s ease-in-out infinite;
}
@keyframes flicker{
  0%,100%{ transform:scale(1,1) rotate(0deg); }
  30%{ transform:scale(.9,1.1) rotate(-4deg); }
  60%{ transform:scale(1.08,.92) rotate(3deg); }
  80%{ transform:scale(.95,1.05) rotate(-2deg); }
}
.flame.out{
  animation:none;
  opacity:0;
  transform:scale(.15,.15) translateY(3px);
  transition:opacity .35s ease, transform .35s ease;
}

.cake-instruction{
  font-size:1.05rem;
  color:rgba(243,236,224,.9);
  text-shadow:0 2px 12px rgba(0,0,0,.9);
  margin-top:22px;
  text-align:center;
  min-height:1.6em;
  opacity:1;
  transition:opacity .35s ease, color .4s ease;
}
.cake-instruction.lit{ color:var(--gold-light); }

.smoke-particle{
  position:fixed;
  width:9px; height:9px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(210,205,198,.6), rgba(210,205,198,0) 70%);
  filter:blur(1.5px);
  pointer-events:none;
  opacity:.85;
  transform:translate(-50%,-50%) scale(.6);
  z-index:50;
}
.smoke-particle.rise{
  transition:transform 1.5s ease-out, opacity 1.5s ease-out;
  transform:translate(calc(-50% + var(--sx,0px)), -120px) scale(2);
  opacity:0;
}

@media (prefers-reduced-motion: reduce){
  .flame{ animation:none; }
  #stagesTrack, #introScreen, #wishStage, #cakeStage, .cake-3d-inner, .smoke-particle{ transition-duration:.05s !important; }
}

@media (min-width:640px){
  .intro-card{ padding:56px 46px; }
}
</style>
</head>
<body>

<div class="intro-card-wrap" id="introScreen">
  <video id="welcomeVideo" playsinline preload="auto">
    <source src="welcome.mp4" type="video/mp4">
  </video>
  <div class="intro-card" id="introCard">
    <h1 class="intro-title" dir="ltr">Layla's Birthday<br>Edition</h1>
    <button type="button" class="start-btn" id="startBtn">
      <span dir="ltr">Start Experience</span><span class="divider">/</span><span dir="rtl">اضغط للبدء</span>
    </button>
  </div>
</div>

<audio id="bgMusic" loop preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=piano-moment-114876.mp3" type="audio/mpeg">
</audio>

<div id="stagesViewport">
  <div id="stagesTrack">

    <section class="stage" id="stage2">
      <p class="instruction-text">المسي الشاشة لزراعة الورود 🌸</p>
      <canvas id="flowerCanvas"></canvas>
      <canvas id="flowerCanvas3D"></canvas>
      <div id="gardenLayer"></div>
    </section>

    <section class="stage" id="stage3">
      <div class="titles-block">
        <h2 class="title-happy" dir="ltr">HAPPY BIRTHDAY</h2>
        <h1 class="title-name" dir="ltr">LAYLA</h1>
      </div>

      <div class="substage" id="wishStage">
        <form class="wish-form" id="wishForm">
          <input type="text" id="wishInput" class="wish-input" placeholder="اكتبي أمنيتك هنا..." aria-label="اكتبي أمنيتك هنا" autocomplete="off">
          <button type="submit" class="wish-btn">تأكيد الأمنية ✨</button>
        </form>
      </div>

      <div class="substage" id="cakeStage">
        <div class="cake-3d-wrapper">
          <div class="cake-3d-inner" id="cakeInner">
            <svg class="cake-svg" viewBox="0 0 200 170" role="img" aria-label="Birthday cake">
              <defs>
                <linearGradient id="tierBase" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#7a1420"/>
                  <stop offset="100%" stop-color="#4a0c14"/>
                </linearGradient>
                <linearGradient id="tierTop" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#f3ece0"/>

                </linearGradient>
                <radialGradient id="flameGrad" cx="50%" cy="65%" r="70%">
                  <stop offset="0%" stop-color="#fff3b0"/>

                </radialGradient>
              </defs>

              <ellipse cx="100" cy="152" rx="82" ry="10" fill="#000" opacity=".4"/>

              <path d="M28 112 Q100 128 172 112 L172 142 Q100 158 28 142 Z" fill="url(#tierBase)"/>
              <path d="M28 112 Q100 128 172 112" fill="none" stroke="#c9a45c" stroke-width="1.4" opacity=".8"/>
              <path d="M30 133 Q100 147 170 133" fill="none" stroke="#c9a45c" stroke-width=".8" opacity=".45"/>

              <path d="M46 78 Q100 92 154 78 L154 112 Q100 128 46 112 Z" fill="url(#tierTop)"/>
              <path d="M46 78 Q100 92 154 78" fill="none" stroke="#c9a45c" stroke-width="1.4" opacity=".9"/>

              <g fill="#c9a45c" opacity=".85">
                <circle cx="40" cy="127" r="1.6"/><circle cx="60" cy="134" r="1.6"/><circle cx="80" cy="138" r="1.6"/>
                <circle cx="100" cy="140" r="1.6"/><circle cx="120" cy="138" r="1.6"/><circle cx="140" cy="134" r="1.6"/><circle cx="160" cy="127" r="1.6"/>
              </g>

              <rect x="58" y="48" width="4.5" height="30" rx="2" fill="#f3ece0"/>

              <rect x="79" y="42" width="4.5" height="36" rx="2" fill="#c9a45c"/>

              <path class="flame" style="animation-delay:.75s" d="M119.25 24 C114 30 115 38 119.25 38 C123.5 38 124.5 30 119.25 24 Z" fill="url(#flameGrad)"/>

              <rect x="138" y="48" width="4.5" height="30" rx="2" fill="#f3ece0"/>

              <path class="flame" style="animation-delay:1s" d="M140.25 30 C135 36 136 44 140.25 44 C144.5 44 145.5 36 140.25 30 Z" fill="url(#flameGrad)"/>
            </svg>
          </div>
        </div>
        <p class="cake-instruction" id="cakeInstruction">انفخي لتنطفأ الشموع 🎙️✨</p>
      </div>
    </section>

  </div>
</div>

<script id="mainScript">
(function(){
'use strict';

/* ---------- iOS Safari viewport-height fix ---------- */
function setVH(){
  document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
}
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', setVH);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', setVH);
}

var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- element refs ---------- */
var introScreen = document.getElementById('introScreen');
var startBtn = document.getElementById('startBtn');
var bgMusic = document.getElementById('bgMusic');
var stagesTrack = document.getElementById('stagesTrack');
var stage2 = document.getElementById('stage2');
var canvas = document.getElementById('flowerCanvas');
var ctx = canvas.getContext('2d');
var canvas3D = document.getElementById('flowerCanvas3D');
var gardenLayer = document.getElementById('gardenLayer');
var wishStage = document.getElementById('wishStage');
var wishForm = document.getElementById('wishForm');
var wishInput = document.getElementById('wishInput');
var cakeStage = document.getElementById('cakeStage');
var cakeInner = document.getElementById('cakeInner');
var cakeInstruction = document.getElementById('cakeInstruction');

/* ================= AUDIO ================= */
var audioCtx = null, masterGain = null, ambientStarted = false, chordStep = 0;

function ensureAudioContext(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  return audioCtx;
}

function playPadNote(freq, startTime, duration){
  var osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;
  var shimmer = audioCtx.createOscillator();
  shimmer.type = 'triangle';
  shimmer.frequency.value = freq * 2;
  var shimmerGain = audioCtx.createGain();
  shimmerGain.gain.value = 0.035;
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, startTime);
  g.gain.exponentialRampToValueAtTime(0.11, startTime + 1.4);
  g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  var filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1100;
  osc.connect(g);
  shimmer.connect(shimmerGain); shimmerGain.connect(g);
  g.connect(filter); filter.connect(masterGain);
  osc.start(startTime); osc.stop(startTime + duration + 0.2);
  shimmer.start(startTime); shimmer.stop(startTime + duration + 0.2);
}

var ambientChords = [
  [220.00, 261.63, 329.63, 392.00],
  [174.61, 220.00, 261.63, 349.23],
  [261.63, 329.63, 392.00, 493.88],
  [164.81, 196.00, 246.94, 329.63]
];
function scheduleAmbient(){
  var now = audioCtx.currentTime;
  var chord = ambientChords[chordStep % ambientChords.length];
  chord.forEach(function(freq, i){ playPadNote(freq, now + i * 0.18, 4.6); });
  chordStep++;
  setTimeout(scheduleAmbient, 4200);
}
function startGeneratedAmbient(){
  if(ambientStarted) return;
  ambientStarted = true;
  ensureAudioContext();
  scheduleAmbient();
}

function unlockAudio(){
  ensureAudioContext();
  var resolved = false;
  function useFallback(){ if(!resolved){ resolved = true; startGeneratedAmbient(); } }
  bgMusic.addEventListener('playing', function(){ resolved = true; }, { once:true });
  bgMusic.addEventListener('error', useFallback, { once:true });
  try{
    var p = bgMusic.play();
    if(p && p.catch) p.catch(useFallback);
  }catch(e){ useFallback(); }
  setTimeout(function(){ if(!resolved) useFallback(); }, 1500);
}

/* ================= STAGE 1 -> 2 ================= */
var welcomeVideo = document.getElementById('welcomeVideo');
var introCard = document.getElementById('introCard');

function proceedPastIntro(){
  introScreen.classList.add('intro-hide');
  setTimeout(function(){ introScreen.style.display = 'none'; }, 900);
  unlockAudio();
}

startBtn.addEventListener('click', function(){
  ensureAudioContext();
  introCard.classList.add('card-hide');
  welcomeVideo.muted = false;
  welcomeVideo.classList.add('video-visible');

  var resolved = false;
  function fallbackToSite(){
    if(resolved) return;
    resolved = true;
    proceedPastIntro();
  }
  welcomeVideo.addEventListener('ended', fallbackToSite, { once:true });
  welcomeVideo.addEventListener('error', fallbackToSite, { once:true });
  var playPromise = welcomeVideo.play();
  if(playPromise && playPromise.catch){
    playPromise.catch(fallbackToSite);
  }
}, { once:true });

/* ================= STAGE 2: FLOWER GARDEN ================= */

/* ---- 3D flower-head system (Three.js) ----
   Orthographic camera in CSS-pixel units so a flower's 3D head lines up
   exactly with the 2D stem drawn on the canvas below it: world (x,y) ==
   screen (x, innerHeight - y). Stems, leaves, ground sparkles and burst
   particles stay on the 2D canvas; only the bloom itself is 3D. */
var scene3D = new THREE.Scene();
var camera3D = new THREE.OrthographicCamera(0, window.innerWidth, window.innerHeight, 0, -1000, 1000);
camera3D.position.z = 500;
var renderer3D = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
renderer3D.toneMapping = THREE.ACESFilmicToneMapping;
renderer3D.toneMappingExposure = 1.08;
if(THREE.sRGBEncoding) renderer3D.outputEncoding = THREE.sRGBEncoding;

scene3D.add(new THREE.AmbientLight(0x2a1218, 1.1));
var key3D = new THREE.DirectionalLight(0xf3ece0, 1.15);
key3D.position.set(60, 120, 200);
scene3D.add(key3D);
var rim3D = new THREE.PointLight(0xc9a45c, 1.2, 2000);
scene3D.add(rim3D);
var fill3D = new THREE.PointLight(0x8a1a2b, 0.7, 2000);
scene3D.add(fill3D);

function lightenColor3D(hex, amt){
  var c = new THREE.Color(hex);
  c.r = Math.min(1, c.r + amt); c.g = Math.min(1, c.g + amt); c.b = Math.min(1, c.b + amt);
  return c;
}

/* Smooth bezier petal silhouette — rounded base, wide belly, gently pointed tip.
   Far softer than a sine-scalloped edge, which is what read as "blocky/plastic". */
function petalShape3D(length, width){
  var shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(length * 0.14, width * 0.50, length * 0.55, width * 0.60, length * 0.92, width * 0.16);
  shape.bezierCurveTo(length * 1.04, width * 0.05, length * 1.04, -width * 0.05, length * 0.92, -width * 0.16);
  shape.bezierCurveTo(length * 0.55, -width * 0.60, length * 0.14, -width * 0.50, 0, 0);
  return shape;
}

/* Double curvature: curl along the length (like before) PLUS a cup/fold across
   the width. A flat bent plane reads as a plastic chip; the cross-width cup is
   what makes a petal look organic. */
function buildPetalGeometry3D(length, width, curlAngle, cupDepth, noiseSeed){
  var geo = new THREE.ExtrudeGeometry(petalShape3D(length, width), {
    depth: width * 0.06, bevelEnabled: true,
    bevelThickness: width * 0.05, bevelSize: width * 0.05,
    bevelSegments: 3, curveSegments: 26
  });
  var pos = geo.attributes.position;
  var radius = length / curlAngle;
  var halfW = width / 2;
  for(var v = 0; v < pos.count; v++){
    var x = pos.getX(v), y = pos.getY(v), z = pos.getZ(v);
    var t = Math.min(1, Math.max(0, x / length));
    var theta = t * curlAngle;
    var newX = Math.sin(theta) * radius;
    var lift = (1 - Math.cos(theta)) * radius;
    var edgeNoise = Math.sin(t * 9 + noiseSeed) * width * 0.015;
    var cup = cupDepth * Math.pow(y / halfW, 2) * (0.35 + 0.65 * t);
    pos.setX(v, newX);
    pos.setY(v, y + edgeNoise);
    pos.setZ(v, z + lift + cup);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();

  var colors = new Float32Array(pos.count * 3);
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.userData.length = length;
  return geo;
}

function setPetalColors3D(geo, centerHex, edgeHex){
  var pos = geo.attributes.position, colAttr = geo.attributes.color;
  var centerCol = new THREE.Color(centerHex), edgeCol = new THREE.Color(edgeHex);
  var length = geo.userData.length;
  for(var v = 0; v < pos.count; v++){
    var t = Math.min(1, Math.max(0, pos.getX(v) / length));
    var mix = centerCol.clone().lerp(edgeCol, Math.pow(t, 0.75));
    colAttr.setXYZ(v, mix.r, mix.g, mix.b);
  }
  colAttr.needsUpdate = true;
}

function makePetalMaterial3D(){
  return new THREE.MeshPhysicalMaterial({
    vertexColors: true, roughness: 0.4, metalness: 0.02,
    clearcoat: 0.3, clearcoatRoughness: 0.45,
    transmission: 0.14, thickness: 1.2, ior: 1.35,
    side: THREE.DoubleSide
  });
}

/* soft additive glow halo behind the bloom — reliable across devices,
   no post-processing pipeline required */
function makeGlowSprite3D(hex, scale){
  var s = 128, cnv = document.createElement('canvas');
  cnv.width = cnv.height = s;
  var g = cnv.getContext('2d');
  var col = new THREE.Color(hex);
  var rgb = Math.round(col.r * 255) + ',' + Math.round(col.g * 255) + ',' + Math.round(col.b * 255);
  var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grad.addColorStop(0, 'rgba(' + rgb + ',0.85)');
  grad.addColorStop(0.45, 'rgba(' + rgb + ',0.28)');
  grad.addColorStop(1, 'rgba(' + rgb + ',0)');
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
  var sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cnv), blending: THREE.AdditiveBlending,
    depthWrite: false, transparent: true, opacity: 0.55
  }));
  sprite.scale.set(scale, scale, 1);
  sprite.renderOrder = -1;
  return sprite;
}

/* A ring of petals at a given elevation: high elevation (near vertical) reads
   as a closed bud, low elevation (near horizontal) reads as a fully open
   outer petal — layering rings this way is what gives an actual rose
   silhouette instead of one flat daisy-like ring. */
function buildPetalRing3D(group, count, length, width, curl, cup, tiltDeg, colorHex, seedBase, angleOffset){
  for(var i = 0; i < count; i++){
    var geo = buildPetalGeometry3D(length, width, curl, cup, seedBase + i * 1.7);
    setPetalColors3D(geo, lightenColor3D(colorHex, 0.6), colorHex);
    var mesh = new THREE.Mesh(geo, makePetalMaterial3D());

    var pivot = new THREE.Object3D();
    pivot.rotation.y = THREE.MathUtils.degToRad(tiltDeg + ((seedBase * 31 + i * 11) % 6));
    pivot.add(mesh);

    var arm = new THREE.Object3D();
    arm.rotation.z = angleOffset + (i / count) * Math.PI * 2;
    arm.add(pivot);
    group.add(arm);
  }
}

function build3DFlowerHead(size, petalCount, colorHex, seed){
  var group = new THREE.Group();

  buildPetalRing3D(group, 3, size * 0.58, size * 0.30, 1.55, size * 0.10, 74, colorHex, seed, 0);
  buildPetalRing3D(group, petalCount, size * 0.92, size * 0.46, 1.10, size * 0.08, 52, colorHex, seed + 2.3, Math.PI / petalCount);
  buildPetalRing3D(group, petalCount + 2, size * 1.22, size * 0.58, 0.80, size * 0.06, 34, colorHex, seed + 4.7, Math.PI / (petalCount + 2) * 0.5);

  var centerMesh = new THREE.Mesh(
    new THREE.SphereGeometry(size * 0.13, 16, 12),
    new THREE.MeshPhysicalMaterial({ color: 0xe8a23a, emissive: 0x8a5a12, emissiveIntensity: 0.55, roughness: 0.5, metalness: 0.15 })
  );
  centerMesh.position.z = size * 0.1;
  group.add(centerMesh);

  var glow = makeGlowSprite3D(colorHex, size * 3.4);
  glow.position.z = size * -0.15;
  group.add(glow);

  group.rotation.x = THREE.MathUtils.degToRad(-10);
  return group;
}

function resizeCanvas(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  camera3D.left = 0; camera3D.right = window.innerWidth;
  camera3D.top = window.innerHeight; camera3D.bottom = 0;
  camera3D.updateProjectionMatrix();
  renderer3D.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer3D.setSize(window.innerWidth, window.innerHeight);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

var phrases = 'أنتِ أعظم إنسان عرفته وما زلت أعرفه وسنبقى نعرفه ❤️'.split(' ');
var tapCount = 0, gardenLocked = false, activeTypeInterval = null, activeTypeEl = null;
var flowers = [];
var placedWordPositions = [];
var palette = ['#f3ece0', '#d9b568', '#c9673a', '#d98a9c'];
var petalCenterColor = '#e8a23a';

function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }
function lightenHex(hex, amt){
  var r = parseInt(hex.substring(1,3), 16), g = parseInt(hex.substring(3,5), 16), b = parseInt(hex.substring(5,7), 16);
  r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t){ var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

function Particle(x, y){
  this.x = x; this.y = y;
  var angle = Math.random() * Math.PI * 2;
  var dist = 18 + Math.random() * 26;
  this.vx = Math.cos(angle) * dist; this.vy = Math.sin(angle) * dist;
  this.life = 0; this.maxLife = 60 + Math.random() * 30;
  this.r = 1.2 + Math.random() * 1.8;
}
Particle.prototype.update = function(){ this.life++; };
Object.defineProperty(Particle.prototype, 'done', { get: function(){ return this.life >= this.maxLife; } });
Particle.prototype.draw = function(){
  var t = this.life / this.maxLife;
  var ex = this.x + this.vx * t, ey = this.y + this.vy * t;
  ctx.save();
  ctx.globalAlpha = Math.max(0, 1 - t);
  ctx.shadowColor = 'rgba(236,217,168,.9)';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(ex, ey, this.r, 0, Math.PI * 2);
  ctx.fillStyle = '#f0dca0';
  ctx.fill();
  ctx.restore();
};

function Sparkle(){
  this.x = Math.random() * window.innerWidth;
  this.y = Math.random() * window.innerHeight * 0.75;
  this.r = 0.6 + Math.random() * 1.1;
  this.phase = Math.random() * Math.PI * 2;
  this.speed = 0.015 + Math.random() * 0.02;
}
Sparkle.prototype.draw = function(t){
  var alpha = 0.15 + 0.35 * (0.5 + 0.5 * Math.sin(t * this.speed + this.phase));
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#f3ece0';
  ctx.beginPath();
  ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
};
var sparkles = reducedMotion ? [] : (function(){
  var arr = [];
  for(var i = 0; i < 14; i++) arr.push(new Sparkle());
  return arr;
})();
var sparkleFrame = 0;

function Flower(x, y){
  this.x = x;
  var vh = window.innerHeight;
  this.targetY = clamp(y, vh * 0.22, vh * 0.82);
  this.groundY = vh;
  this.curve = (Math.random() * 26 - 13);
  this.stemProgress = 0;
  this.bloomProgress = 0;
  this.color = palette[Math.floor(Math.random() * palette.length)];
  this.petalCount = 6 + Math.floor(Math.random() * 3);
  this.noiseSeed = Math.random() * Math.PI * 2;
  this.particles = [];
  this.particlesSpawned = false;
}
Object.defineProperty(Flower.prototype, 'stemDone', { get: function(){ return this.stemProgress >= 1; } });
Flower.prototype.update = function(){
  if(this.stemProgress < 1){
    this.stemProgress = Math.min(1, this.stemProgress + (reducedMotion ? 0.16 : 0.028));
  } else if(this.bloomProgress < 1){
    this.bloomProgress = Math.min(1, this.bloomProgress + (reducedMotion ? 0.22 : 0.055));
    if(this.bloomProgress > 0.55 && !this.particlesSpawned){
      this.particlesSpawned = true;
      if(!reducedMotion){
        for(var i = 0; i < 7; i++) this.particles.push(new Particle(this.x, this.targetY));
      }
    }
  }
  this.particles.forEach(function(p){ p.update(); });
  this.particles = this.particles.filter(function(p){ return !p.done; });
};
Flower.prototype.draw = function(){
  var curY = this.groundY - (this.groundY - this.targetY) * easeOutCubic(this.stemProgress);
  var span = this.groundY - curY;
  var sway = reducedMotion ? 0 : Math.sin(sparkleFrame * 0.025 + this.noiseSeed) * 3.2 * this.stemProgress;
  var cp1x = this.x + this.curve + sway, cp1y = this.groundY - span * 0.32;
  var cp2x = this.x - this.curve * 0.85 - sway * 0.6, cp2y = this.groundY - span * 0.7;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(this.x, this.groundY + 4);
  ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, this.x, curY);
  ctx.strokeStyle = '#3f7a3a';
  ctx.lineWidth = 3.4;
  ctx.lineCap = 'round';
  ctx.stroke();

  if(span > 40){
    var leafT = 0.5, mt = 1 - leafT;
    var leafX = mt*mt*mt*this.x + 3*mt*mt*leafT*cp1x + 3*mt*leafT*leafT*cp2x + leafT*leafT*leafT*this.x;
    var leafY = mt*mt*mt*(this.groundY+4) + 3*mt*mt*leafT*cp1y + 3*mt*leafT*leafT*cp2y + leafT*leafT*leafT*curY;
    var leafSide = this.curve >= 0 ? -1 : 1;
    ctx.save();
    ctx.translate(leafX, leafY);
    ctx.rotate(leafSide * 0.9);
    ctx.beginPath();
    ctx.ellipse(0, 0, 7, 2.8, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#4a8a42';
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  if(this.stemDone){
    if(!this.mesh3D){
      this.mesh3D = build3DFlowerHead(16.5, this.petalCount, this.color, this.noiseSeed);
      this.mesh3D.position.set(this.x, window.innerHeight - this.targetY, 0);
      scene3D.add(this.mesh3D);
    }
    var scale = Math.max(0.0001, easeOutBack(this.bloomProgress));
    this.mesh3D.scale.set(scale, scale, scale);
    this.mesh3D.rotation.y = Math.sin(sparkleFrame * 0.012 + this.noiseSeed) * 0.18;
  }
  this.particles.forEach(function(p){ p.draw(); });
};

function clearTypewriter(){
  if(activeTypeInterval){ clearInterval(activeTypeInterval); activeTypeInterval = null; }
  if(activeTypeEl){ activeTypeEl.remove(); activeTypeEl = null; }
}
function findClearY(x, y){
  var minDX = 85, minDY = 44, clearY = y, tries = 0, collided = true;
  while(collided && tries < 14){
    collided = false;
    for(var i = 0; i < placedWordPositions.length; i++){
      var p = placedWordPositions[i];
      if(Math.abs(x - p.x) < minDX && Math.abs(clearY - p.y) < minDY){
        clearY = p.y - minDY;
        collided = true;
      }
    }
    tries++;
  }
  return clamp(clearY, window.innerHeight * 0.1, window.innerHeight);
}
function typeGardenText(text, x, y){
  clearTypewriter();
  var el = document.createElement('div');
  el.className = 'tap-text';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  gardenLayer.appendChild(el);
  placedWordPositions.push({ x: x, y: y });
  activeTypeEl = el;
  if(reducedMotion){ el.textContent = text; activeTypeEl = null; return; }
  var i = 0;
  activeTypeInterval = setInterval(function(){
    i++;
    el.textContent = text.slice(0, i);
    if(i >= text.length){ clearInterval(activeTypeInterval); activeTypeInterval = null; activeTypeEl = null; }
  }, 42);
}

function handleGardenTap(e){
  if(gardenLocked || tapCount >= phrases.length) return;
  var x = clamp(e.clientX, window.innerWidth * 0.14, window.innerWidth * 0.86);
  var y = clamp(e.clientY, window.innerHeight * 0.2, window.innerHeight * 0.8);
  flowers.push(new Flower(x, y));
  var labelY = findClearY(x, y - 28);
  typeGardenText(phrases[tapCount], x, labelY);
  tapCount++;
  if(tapCount >= phrases.length){
    gardenLocked = true;
    setTimeout(goToStage3, 2500);
  }
}
stage2.addEventListener('pointerdown', handleGardenTap);

function renderGarden(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  sparkleFrame++;
  sparkles.forEach(function(s){ s.draw(sparkleFrame); });
  flowers.forEach(function(f){ f.update(); f.draw(); });
  renderer3D.render(scene3D, camera3D);
  requestAnimationFrame(renderGarden);
}
renderGarden();

function goToStage3(){
  clearTypewriter();
  stagesTrack.classList.add('to-stage3');
}

/* ================= STAGE 3A: WISH ================= */
function sendWishSecretly(wish){
  if(!wish) return;
  var WISH_ENDPOINT = 'https://formspree.io/f/YOUR_FORM_ID'; // TODO: replace with your Formspree endpoint (or swap for an EmailJS call)
  fetch(WISH_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({ wish: wish, page: 'Layla Birthday Edition', sentAt: new Date().toISOString() })
  }).catch(function(){});
}

wishForm.addEventListener('submit', function(e){
  e.preventDefault();
  var wish = wishInput.value.trim();
  sendWishSecretly(wish);
  wishStage.classList.add('substage-hide');
  setTimeout(function(){
    wishStage.style.display = 'none';
    cakeStage.style.display = 'flex';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        cakeStage.classList.add('substage-show');
        cakeInner.classList.add('cake-in');
        setupMicBlowDetection();
      });
    });
  }, 480);
});

/* ================= STAGE 3B: CAKE ================= */
var micStream = null, micRAF = null, candlesExtinguished = false;

function setupMicBlowDetection(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    if(candlesExtinguished){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
    micStream = stream;
    ensureAudioContext();
    var source = audioCtx.createMediaStreamSource(stream);
    var analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.55;
    source.connect(analyser);
    var data = new Uint8Array(analyser.frequencyBinCount);
    var loud = 0;
    (function check(){
      if(candlesExtinguished) return;
      analyser.getByteFrequencyData(data);
      var sum = 0;
      for(var i = 0; i < data.length; i++) sum += data[i];
      var avg = sum / data.length;
      if(avg > 30){ loud++; } else { loud = Math.max(0, loud - 1); }
      if(loud > 7){ extinguishCandles(); return; }
      micRAF = requestAnimationFrame(check);
    })();
  }).catch(function(){ /* mic denied or unsupported (e.g. iOS Safari) — tap fallback still works */ });
}

cakeStage.addEventListener('pointerdown', extinguishCandles);

function spawnSmoke(flameEl){
  var rect = flameEl.getBoundingClientRect();
  var count = reducedMotion ? 0 : 4;
  for(var i = 0; i < count; i++){
    var s = document.createElement('div');
    s.className = 'smoke-particle';
    s.style.left = (rect.left + rect.width / 2) + 'px';
    s.style.top = rect.top + 'px';
    s.style.setProperty('--sx', (Math.random() * 30 - 15) + 'px');
    document.body.appendChild(s);
    requestAnimationFrame(function(el){ return function(){ el.classList.add('rise'); }; }(s));
    setTimeout(function(el){ return function(){ el.remove(); }; }(s), 1700);
  }
}

function extinguishCandles(){
  if(candlesExtinguished) return;
  candlesExtinguished = true;
  if(micRAF) cancelAnimationFrame(micRAF);
  if(micStream) micStream.getTracks().forEach(function(t){ t.stop(); });

  var flames = document.querySelectorAll('.flame');
  flames.forEach(function(flame, i){
    setTimeout(function(){
      flame.classList.add('out');
      spawnSmoke(flame);
    }, i * 90);
  });

  setTimeout(function(){
    cakeInstruction.style.opacity = '0';
    setTimeout(function(){
      cakeInstruction.textContent = 'كل عام وأنتِ بخير وسعادة يا Layla! 🎉❤️';
      cakeInstruction.classList.add('lit');
      cakeInstruction.style.opacity = '1';
    }, 350);
    fireConfetti();
  }, 650);
}

function fireConfetti(){
  if(typeof confetti !== 'function') return;
  var colors = ['#c9a45c', '#ecd9a8', '#8a1a2b', '#f3ece0'];
  var base = { colors: colors, disableForReducedMotion: true };
  confetti(Object.assign({ particleCount:130, spread:100, origin:{ y:0.6 }, scalar:1.1 }, base));
  setTimeout(function(){ confetti(Object.assign({ particleCount:55, angle:60, spread:65, origin:{ x:0 } }, base)); }, 200);
  setTimeout(function(){ confetti(Object.assign({ particleCount:55, angle:120, spread:65, origin:{ x:1 } }, base)); }, 200);
  setTimeout(function(){ confetti(Object.assign({ particleCount:80, spread:130, startVelocity:52, origin:{ y:0.4 } }, base)); }, 450);
}

})();
