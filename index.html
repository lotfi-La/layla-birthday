<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Layla</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background: #050505; color: #fff; font-family: 'Cairo', sans-serif; overflow: hidden; }

        /* Intro Screen */
        .intro-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #1a0203 0%, #000 100%);
            z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s ease, visibility 1s;
        }
        .intro-title {
            font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #fff; font-style: italic;
            text-shadow: 0 0 15px rgba(229, 9, 20, 0.8); margin-bottom: 30px; letter-spacing: 2px;
        }
        .start-btn {
            background: linear-gradient(135deg, #E50914, #900C3F); color: #fff; border: none;
            padding: 14px 38px; font-size: 1.1rem; font-weight: 700; border-radius: 30px;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.5); cursor: pointer;
        }

        /* Flower Scene */
        .scene { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }

        .instruction {
            position: absolute; top: 6%; width: 100%; text-align: center;
            font-size: 1.1rem; color: rgba(255, 255, 255, 0.85); pointer-events: none;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9); z-index: 10;
        }

        /* Typewriter Text */
        .typewriter-text {
            position: absolute; color: #fff; font-size: 1.15rem; font-weight: 700;
            text-shadow: 0 0 12px rgba(229, 9, 20, 0.9), 0 2px 5px #000;
            pointer-events: none; white-space: nowrap; z-index: 20;
            border-left: 2px solid #E50914; padding-left: 5px;
            animation: blink 0.7s infinite alternate;
        }
        @keyframes blink { 0% { border-color: transparent; } 100% { border-color: #E50914; } }

        /* Cinema Section (Slide Up) */
        .cinema-section {
            position: absolute; top: 100vh; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #140204 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; z-index: 30; transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            padding: 20px;
        }
        .cinema-section.active { transform: translateY(-100vh); }

        .title-hb {
            font-family: 'Playfair Display', serif; font-size: 2.8rem; font-style: italic;
            background: linear-gradient(180deg, #fff 40%, #E50914 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .name-title {
            font-family: 'Playfair Display', serif; font-size: 2.4rem; color: #fff;
            letter-spacing: 4px; margin-bottom: 25px; text-shadow: 0 0 20px #E50914;
        }

        /* Wish Form Stage */
        .wish-box {
            display: flex; flex-direction: column; align-items: center; gap: 12px; width: 85%; max-width: 320px;
        }
        .wish-input {
            width: 100%; padding: 12px 18px; border-radius: 25px; border: 1px solid rgba(229, 9, 20, 0.6);
            background: rgba(255, 255, 255, 0.07); color: #fff; text-align: center; font-size: 1rem;
            outline: none; font-family: 'Cairo', sans-serif;
        }
        .wish-btn {
            background: #E50914; color: #fff; border: none; padding: 10px 25px; border-radius: 20px;
            font-weight: 700; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 15px rgba(229,9,20,0.4);
        }

        /* 3D Rotating Cake Stage */
        .cake-stage {
            display: none; flex-direction: column; align-items: center;
            animation: cake3D 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes cake3D {
            0% { transform: scale(0.2) rotateY(180deg) translateY(200px); opacity: 0; }
            100% { transform: scale(1) rotateY(0deg) translateY(0); opacity: 1; }
        }

        .cake-svg { width: 220px; height: 180px; cursor: pointer; }
        .flame { animation: flicker 0.15s infinite alternate; transform-origin: center bottom; }
        @keyframes flicker { 0% { transform: scale(1); } 100% { transform: scale(1.15) rotate(2deg); } }

        .blow-instruction { margin-top: 15px; font-size: 1.1rem; color: #e5e5e5; font-weight: 700; }
    </style>
</head>
<body>

    <div class="intro-overlay" id="introOverlay">
        <div class="intro-title">Layla's Birthday</div>
        <button class="start-btn" onclick="startExperience()">اضغط للبدء ✨</button>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=piano-moment-114876.mp3" type="audio/mpeg">
    </audio>

    <div class="scene">
        <div class="instruction">المسي الشاشة لزراعة الورود 🌸</div>
        <canvas id="flowerCanvas"></canvas>
    </div>

    <section class="cinema-section" id="scene2">
        <h1 class="title-hb">HAPPY BIRTHDAY</h1>
        <h2 class="name-title">LAYLA</h2>

        <form class="wish-box" id="wishForm" onsubmit="submitWish(event)">
            <input type="text" name="wish" class="wish-input" id="wishInput" placeholder="اكتبي أمنيتك هنا..." required autocomplete="off">
            <button type="submit" class="wish-btn">تأكيد الأمنية ✨</button>
        </form>

        <div class="cake-stage" id="cakeStage" onclick="extinguishCandles()">
            <svg class="cake-svg" viewBox="0 0 200 160">
                <ellipse cx="100" cy="145" rx="85" ry="12" fill="#222" stroke="#444" stroke-width="2"/>
                <path d="M 30 110 Q 100 125 170 110 L 170 140 Q 100 155 30 140 Z" fill="#2a080c"/>
                <path d="M 30 110 Q 100 125 170 110 L 170 120 Q 100 135 30 120 Z" fill="#E50914"/>
                <path d="M 45 75 Q 100 90 155 75 L 155 110 Q 100 125 45 110 Z" fill="#3d0c12"/>
                <path d="M 45 75 Q 100 90 155 75 L 155 83 Q 100 98 45 83 Z" fill="#fff"/>
                
                <rect x="55" y="45" width="6" height="30" fill="#fff" rx="2"/>
                <circle class="flame flame-item" cx="58" cy="40" r="5" fill="#ff9d00"/>

                <rect x="78" y="40" width="6" height="35" fill="#E50914" rx="2"/>
                <circle class="flame flame-item" cx="81" cy="35" r="5" fill="#ff9d00"/>

                <rect x="97" y="35" width="6" height="40" fill="#fff" rx="2"/>
                <circle class="flame flame-item" cx="100" cy="30" r="6" fill="#ff9d00"/>

                <rect x="116" y="40" width="6" height="35" fill="#E50914" rx="2"/>
                <circle class="flame flame-item" cx="119" cy="35" r="5" fill="#ff9d00"/>

                <rect x="138" y="45" width="6" height="30" fill="#fff" rx="2"/>
                <circle class="flame flame-item" cx="141" cy="40" r="5" fill="#ff9d00"/>
            </svg>
            <div class="blow-instruction" id="blowText">انفخي لتنطفأ الشموع 🎙️✨</div>
        </div>
    </section>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        let flowers = [];
        let flowerCount = 0;
        let activeText = null;

        const messages = [
            "أنتِ أعظم إنسان عرفته",
            "وما زلت أعرفه",
            "وسنبقى نعرفه ❤️"
        ];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function startExperience() {
            document.getElementById('introOverlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('introOverlay').style.display = 'none'; }, 1000);
            document.getElementById('bgMusic').play().catch(()=>{});
            initMicBlow();
        }

        class MobileFlower {
            constructor(x, y) {
                this.x = x;
                const minY = canvas.height * 0.3;
                const maxY = canvas.height * 0.75;
                this.targetY = Math.max(minY, Math.min(y, maxY));
                this.stemHeight = 0;
                this.maxStemHeight = canvas.height - this.targetY;
                this.petalScale = 0;
                this.color = ['#E50914', '#ff4d4d', '#ffffff', '#ff99a8'][Math.floor(Math.random() * 4)];
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, canvas.height);
                ctx.quadraticCurveTo(this.x - 12, canvas.height - this.stemHeight / 2, this.x, canvas.height - this.stemHeight);
                ctx.strokeStyle = '#2d7a32';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                if (this.stemHeight >= this.maxStemHeight) {
                    const topY = canvas.height - this.maxStemHeight;
                    ctx.save();
                    ctx.translate(this.x, topY);
                    
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * Math.PI * 2) / 5;
                        ctx.save();
                        ctx.rotate(angle);
                        ctx.beginPath();
                        ctx.arc(0, -16 * this.petalScale, 11 * this.petalScale, 0, Math.PI * 2);
                        ctx.fillStyle = this.color;
                        ctx.fill();
                        ctx.restore();
                    }
                    ctx.beginPath();
                    ctx.arc(0, 0, 6 * this.petalScale, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fill();
                    ctx.restore();
                }
            }

            update() {
                if (this.stemHeight < this.maxStemHeight) {
                    this.stemHeight += (this.maxStemHeight - this.stemHeight) * 0.12 + 3;
                } else if (this.petalScale < 1) {
                    this.petalScale += 0.06;
                }
            }
        }

        function typeWriter(text, x, y) {
            if (activeText) activeText.remove();

            const el = document.createElement('div');
            el.className = 'typewriter-text';
            const posX = Math.min(Math.max(x, 110), canvas.width - 110);
            el.style.left = `${posX}px`;
            el.style.top = `${y - 45}px`;
            el.style.transform = 'translateX(-50%)';
            document.body.appendChild(el);
            activeText = el;

            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerText += text.charAt(i);
                    i++;
                    setTimeout(type, 70);
                }
            }
            type();
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            flowers.push(new MobileFlower(x, y));
            typeWriter(messages[flowerCount % messages.length], x, y);
            flowerCount++;

            if (flowerCount === 3) {
                setTimeout(() => {
                    if (activeText) activeText.remove();
                    document.getElementById('scene2').classList.add('active');
                }, 2400);
            }
        });

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            flowers.forEach(f => { f.update(); f.draw(); });
            requestAnimationFrame(render);
        }
        render();

        /* Submit Wish to Email (Formspree) */
        function submitWish(event) {
            event.preventDefault();
            const wishInput = document.getElementById('wishInput').value;

            // Formspree API Request
            fetch('https://formspree.io/f/YOUR_FORMSPREE_ID', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ LaylaWish: wishInput })
            }).catch(() => {});

            document.getElementById('wishForm').style.display = 'none';
            document.getElementById('cakeStage').style.display = 'flex';
        }

        /* Extinguish Candles & Fireworks */
        function extinguishCandles() {
            const flames = document.querySelectorAll('.flame-item');
            flames.forEach(f => f.style.display = 'none');

            document.getElementById('blowText').innerText = "كل عام وأنتِ بخير وسعادة يا Layla! 🎉❤️";
            document.getElementById('blowText').style.color = "#E50914";

            var duration = 4 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 8, angle: 60, spread: 60, origin: { x: 0, y: 0.7 } });
                confetti({ particleCount: 8, angle: 120, spread: 60, origin: { x: 1, y: 0.7 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        /* Microphone Audio Detector */
        function initMicBlow() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const analyser = audioContext.createAnalyser();
                    const microphone = audioContext.createMediaStreamSource(stream);
                    microphone.connect(analyser);
                    analyser.fftSize = 256;
                    const bufferLength = analyser.frequencyBinCount;
                    const dataArray = new Uint8Array(bufferLength);

                    function checkBlow() {
                        analyser.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
                        let average = sum / bufferLength;

                        if (average > 42) {
                            extinguishCandles();
                            stream.getTracks().forEach(track => track.stop());
                        } else {
                            requestAnimationFrame(checkBlow);
                        }
                    }
                    checkBlow();
                }).catch(() => {});
            }
        }
    </script>
</body>
</html>
