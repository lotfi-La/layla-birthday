<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<title>Layla's Birthday Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Playfair+Display:ital,wght@1,600;1,800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
<style>
:root{
  --bg:#050505;
  --wine:#5c0f1a;
  --wine-bright:#8a1a2b;
  --gold:#c9a45c;
  --gold-light:#ecd9a8;
  --cream:#f3ece0;
  --vh:1vh;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0;
  width:100%; height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:var(--bg);
  color:var(--cream);
  font-family:'Cairo',sans-serif;
}

body{
  position:fixed;
  inset:0;
  height:100vh;
  height:calc(var(--vh,1vh) * 100);
  height:100dvh;
  background:
    radial-gradient(ellipse 60% 40% at 18% 15%, rgba(138,26,43,.30), transparent 60%),
    radial-gradient(ellipse 50% 35% at 85% 20%, rgba(201,164,92,.14), transparent 60%),
    radial-gradient(ellipse 70% 45% at 50% 100%, rgba(92,15,26,.35), transparent 65%),
    var(--bg);
}

button,input{ font-family:inherit; }
button{ -webkit-appearance:none; appearance:none; }

/* ================= Stage viewport / track ================= */
#stagesViewport{
  position:relative;
  width:100%;
  height:100vh;
  height:calc(var(--vh,1vh) * 100);
  height:100dvh;
  overflow:hidden;
}
#stagesTrack{
  display:flex;
  flex-direction:column;
  width:100%;
  transform:translateY(0);
  transition:transform 1.15s cubic-bezier(.65,0,.35,1);
}
#stagesTrack.to-stage3{
  transform:translateY(-100vh);
  transform:translateY(calc(var(--vh,1vh) * -100));
  transform:translateY(-100dvh);
}
.stage{
  position:relative;
  width:100%;
  height:100vh;
  height:calc(var(--vh,1vh) * 100);
  height:100dvh;
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* ================= Intro ================= */
#introScreen{
  position:fixed; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  padding-top:max(24px, env(safe-area-inset-top));
  padding-bottom:max(24px, env(safe-area-inset-bottom));
  transition:opacity .45s ease, transform .45s ease;
}
#introScreen.intro-hide{ opacity:0; transform:scale(1.04); pointer-events:none; }

.intro-card{
  position:relative;
  z-index:2;
  transition:opacity .5s ease;
  text-align:center;
  padding:46px 30px;
  max-width:380px;
  width:100%;
  border:1px solid rgba(201,164,92,.32);
  background:linear-gradient(165deg, rgba(30,10,12,.55), rgba(5,5,5,.9));
  box-shadow:0 0 70px rgba(201,164,92,.07), inset 0 0 50px rgba(92,15,26,.15);
}
.intro-card::before,.intro-card::after{
  content:''; position:absolute; width:22px; height:22px;
  border:1px solid var(--gold); opacity:.55;
}
.intro-card::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
.intro-card::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
.intro-card.card-hide{ opacity:0; pointer-events:none; }

#welcomeVideo{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  opacity:0;
  z-index:1;
  transition:opacity .6s ease;
  pointer-events:none;
}
#welcomeVideo.video-visible{ opacity:1; }

/* ================= Candle QTE: cinematic spotlight (dims everything but the button) ================= */
.candle-spotlight{
  position:absolute;
  inset:0;
  z-index:4;
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease;
  background:radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 95px, rgba(0,0,0,.55) 230px, rgba(0,0,0,.72) 100%);
}
.candle-spotlight.show{ opacity:1; }

/* ================= Candle QTE button (welcome video) — glowing dial/portal ================= */
.candle-tap-btn{
  position:absolute;
  z-index:6;
  width:52px; height:52px;
  border-radius:50%;
  background:transparent;
  border:none;
  box-shadow:
    0 0 16px 5px rgba(255,178,90,.6),
    0 0 38px 14px rgba(255,140,50,.36);
  opacity:0;
  transform:translate(-50%,-50%) scale(.35);
  pointer-events:none;
  cursor:pointer;
  padding:0;
  transition:opacity .25s ease, transform .25s ease;
}
.candle-tap-btn .dial-svg{
  width:100%; height:100%; display:block;
  filter:drop-shadow(0 0 10px rgba(255,180,90,.95));
}
.candle-tap-btn.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
  pointer-events:auto;
  animation:candleShake 1s ease-in-out infinite, candlePulse 1.1s ease-in-out infinite;
}
@keyframes candleShake{
  0%, 100%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); }
  20%{ transform:translate(calc(-50% - 3px), calc(-50% + 1px)) scale(1.05) rotate(-5deg); }
  40%{ transform:translate(calc(-50% + 3px), calc(-50% - 1px)) scale(1.05) rotate(5deg); }
  60%{ transform:translate(calc(-50% - 2px), calc(-50% + 1px)) scale(1.05) rotate(-3deg); }
  80%{ transform:translate(calc(-50% + 2px), calc(-50% - 1px)) scale(1.05) rotate(3deg); }
}
@keyframes candlePulse{
  0%, 100%{
    box-shadow:
      0 0 16px 5px rgba(255,178,90,.6),
      0 0 38px 14px rgba(255,140,50,.36);
  }
  50%{
    box-shadow:
      0 0 26px 10px rgba(255,210,140,.9),
      0 0 58px 22px rgba(255,155,65,.55);
  }
}
.candle-tap-btn.show.no-shake{ animation:none; }

.intro-title{
  font-family:'Playfair Display', serif;
  font-style:italic;
  font-weight:700;
  font-size:1.7rem;
  line-height:1.4;
  margin:0 0 36px;
  background:linear-gradient(180deg, var(--cream) 15%, var(--gold-light) 70%, var(--gold) 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}

.start-btn{
  font-size:.98rem;
  padding:15px 30px;
  border:1px solid var(--gold);
  background:linear-gradient(135deg, rgba(201,164,92,.16), rgba(201,164,92,.04));
  color:var(--gold-light);
  cursor:pointer;
  letter-spacing:.02em;
  touch-action:manipulation;
  transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
  display:inline-flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:9px;
}
.start-btn .divider{ opacity:.5; }
.start-btn:active{
  transform:scale(.96);
  box-shadow:0 0 26px rgba(201,164,92,.4);
  background:linear-gradient(135deg, rgba(201,164,92,.28), rgba(201,164,92,.08));
}
.start-btn:focus-visible, .wish-btn:focus-visible, .wish-input:focus-visible{
  outline:2px solid var(--gold-light); outline-offset:3px;
}

/* ================= Stage 2: WISH (fixed fade overlay, shown right after welcome video) ================= */
.wish-stage-wrap{
  position:fixed; inset:0; z-index:150;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  padding-top:max(24px, env(safe-area-inset-top));
  padding-bottom:max(24px, env(safe-area-inset-bottom));
  background:var(--bg);
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease;
}
.wish-stage-wrap.show{ opacity:1; pointer-events:auto; }
.wish-instruction{ position:static; margin-bottom:22px; pointer-events:auto; }
.wish-sent-msg{
  margin-top:18px;
  min-height:1.3em;
  color:var(--gold-light);
  font-size:.95rem;
  text-align:center;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .6s ease, transform .6s ease;
}
.wish-sent-msg.show{ opacity:1; transform:translateY(0); }
.wish-form.sending .wish-btn{ opacity:.6; pointer-events:none; }

/* ================= Stage 3: CELEBRATION FORK ================= */
.fork-stage-wrap{
  position:fixed; inset:0; z-index:140;
  background:var(--bg);
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease;
}
.fork-stage-wrap.show{ opacity:1; pointer-events:auto; }
.fork-title{
  position:absolute; top:12%; left:0; right:0;
  font-family:'Cinzel', serif;
  font-weight:700;
  font-size:clamp(1.1rem, 5vw, 1.4rem);
  color:var(--cream);
  text-align:center;
  letter-spacing:.02em;
  padding:0 20px;
}
.fork-option{
  position:absolute;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}
.fork-option-left{ top:40%; left:9%; }
.fork-option-right{ top:47%; right:9%; }
.fork-label{
  color:var(--cream);
  font-weight:600;
  font-size:1rem;
  text-shadow:0 2px 14px rgba(0,0,0,.9);
  white-space:nowrap;
}
.fork-dot{
  width:46px; height:46px;
  border-radius:50%;
  background:transparent;
  border:none;
  padding:0;
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .2s ease, box-shadow .2s ease;
}
.fork-dot:active{ transform:scale(.88); }

/* left = decoy, deliberately made the more tempting/eye-catching of the two */
.fork-option-left .fork-dot{
  width:54px; height:54px;
  box-shadow:
    0 0 18px 6px rgba(255,196,110,.75),
    0 0 44px 16px rgba(255,150,60,.45);
  animation:forkDotPulse 1.4s ease-in-out infinite;
}
.fork-option-left .fork-label{
  color:var(--gold-light);
  font-weight:700;
  text-shadow:0 0 18px rgba(255,178,90,.5), 0 2px 14px rgba(0,0,0,.9);
}
@keyframes forkDotPulse{
  0%, 100%{
    box-shadow:
      0 0 18px 6px rgba(255,196,110,.75),
      0 0 44px 16px rgba(255,150,60,.45);
  }
  50%{
    box-shadow:
      0 0 26px 10px rgba(255,214,145,.95),
      0 0 60px 22px rgba(255,164,75,.6);
  }
}

/* right = correct choice, deliberately understated so the eye drifts to the left */
.fork-option-right .fork-dot{
  width:36px; height:36px;
  box-shadow:0 0 6px 2px rgba(180,180,180,.25);
}
.fork-option-right .fork-label{
  color:rgba(243,236,224,.55);
  font-weight:500;
}

/* ================= Stage 5a: FIREWORK LAUNCH (pre-video mini-scene) ================= */
.launch-stage-wrap{
  position:fixed; inset:0; z-index:136;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease;
  overflow:hidden;
  touch-action:none;
}
.launch-stage-wrap.show{ opacity:1; pointer-events:auto; }
.launch-hint{
  position:absolute; top:10%; left:0; right:0;
  text-align:center;
  color:var(--gold-light);
  font-weight:600;
  font-size:clamp(.95rem, 4.2vw, 1.15rem);
  text-shadow:0 2px 14px rgba(0,0,0,.9);
  padding:0 20px;
  transition:opacity .4s ease;
}
.launch-stage-wrap.all-launched .launch-hint{ opacity:0; }
.launch-firework{
  position:absolute;
  left:var(--lx); top:var(--ly);
  width:15vw; max-width:64px; min-width:38px;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 6px rgba(201,164,92,.75)) drop-shadow(0 0 16px rgba(201,164,92,.4));
  animation:launchIdlePulse 1.6s ease-in-out infinite;
}
.launch-firework-svg{ width:100%; height:auto; display:block; }
@keyframes launchIdlePulse{
  0%, 100%{ filter:drop-shadow(0 0 6px rgba(201,164,92,.75)) drop-shadow(0 0 16px rgba(201,164,92,.4)); }
  50%{ filter:drop-shadow(0 0 10px rgba(236,217,168,.95)) drop-shadow(0 0 26px rgba(201,164,92,.65)); }
}
.launch-firework.flying{
  animation:none; /* JS now drives position/scale every frame for the wavy flight path */
  filter:drop-shadow(0 0 16px rgba(255,255,255,.95)) drop-shadow(0 0 36px rgba(201,164,92,.75));
  pointer-events:none;
}
.meteor-trail-dot{
  position:fixed;
  z-index:137;
  width:10px; height:10px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 10px 4px rgba(255,255,255,.9), 0 0 22px 10px rgba(255,255,255,.5);
  transform:translate(-50%,-50%);
  pointer-events:none;
  animation:meteorTrailFade .42s ease-out forwards;
}
@keyframes meteorTrailFade{
  0%{ opacity:.9; transform:translate(-50%,-50%) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(.15); }
}
.launch-spark-burst{
  position:absolute;
  left:0; top:0;
  width:6px; height:6px;
  border-radius:50%;
  background:var(--gold-light);
  box-shadow:0 0 8px 3px rgba(236,217,168,.9);
  transform:translate(-50%,-50%);
  animation:launchSparkOut .55s ease-out forwards;
}
@keyframes launchSparkOut{
  0%{ transform:translate(-50%,-50%) translate(0,0) scale(1); opacity:1; }
  100%{ transform:translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(.2); opacity:0; }
}

/* ================= Stage 5: FIREWORKS VIDEO (right fork path) ================= */
.fireworks-stage-wrap{
  position:fixed; inset:0; z-index:135;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease;
  overflow:hidden;
}
.fireworks-stage-wrap.show{ opacity:1; pointer-events:auto; }
#fireworksVideo{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
}

/* ================= TEMPORARY placeholder for unfinished fork paths ================= */
.placeholder-stage-wrap{
  position:fixed; inset:0; z-index:145;
  display:flex; align-items:center; justify-content:center;
  padding:32px;
  background:var(--bg);
  opacity:0;
  pointer-events:none;
  transition:opacity .6s ease;
}
.placeholder-stage-wrap.show{ opacity:1; pointer-events:auto; }
.placeholder-text{
  color:var(--gold-light);
  font-size:1rem;
  text-align:center;
  max-width:320px;
  line-height:1.8;
}

/* ================= Stage 2: garden ================= */
.instruction-text{
  position:absolute;
  top:9%;
  top:max(9%, calc(env(safe-area-inset-top) + 20px));
  left:0; right:0;
  text-align:center;
  font-size:1.05rem;
  color:rgba(243,236,224,.88);
  text-shadow:0 2px 14px rgba(0,0,0,.9);
  z-index:5;
  padding:0 24px;
  pointer-events:none;
}

canvas#flowerCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; }
.roseBloom{
  position:absolute; width:56px; height:auto;
  transform:translate(-50%,0) scale(.05) rotate(var(--rot,0deg));
  transform-origin:50% 0%;
  opacity:0; pointer-events:none;
  transition:transform 1050ms cubic-bezier(.19,1.6,.32,1), opacity 550ms ease-out;
  will-change:transform, opacity;
}
.roseBloom.grown{ transform:translate(-50%,0) scale(var(--scale,1)) rotate(var(--rot,0deg)); opacity:1; }
#gardenLayer{ position:absolute; inset:0; pointer-events:none; z-index:6; }

.tap-text{
  position:absolute;
  max-width:min(78vw, 320px);
  text-align:center;
  font-weight:600;
  font-size:1.05rem;
  line-height:1.5;
  color:var(--gold-light);
  text-shadow:0 2px 16px rgba(0,0,0,.95);
  pointer-events:none;
  transform:translate(-50%,-100%);
}

/* ================= Stage 3 ================= */
#stage3{ padding:0 20px; }
.titles-block{ text-align:center; margin-bottom:9vh; }
.title-happy{
  font-family:'Cinzel', serif;
  font-weight:700;
  font-size:clamp(1.6rem, 7.5vw, 2.4rem);
  letter-spacing:.15em;
  color:var(--cream);
  margin:0 0 8px;
  text-shadow:0 0 30px rgba(201,164,92,.35);
}
.title-name{
  font-family:'Playfair Display', serif;
  font-style:italic;
  font-weight:800;
  font-size:clamp(2.6rem, 14vw, 4.2rem);
  margin:0;
  background:linear-gradient(180deg, var(--gold-light) 25%, var(--wine-bright) 135%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 24px rgba(92,15,26,.5));
}

.substage{ display:flex; flex-direction:column; align-items:center; width:100%; max-width:340px; }

#wishStage{ transition:opacity .5s ease, transform .5s ease; }
#wishStage.substage-hide{ opacity:0; transform:translateY(-14px) scale(1.02); pointer-events:none; }

.wish-form{ display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; }
.wish-input{
  width:100%;
  padding:14px 18px;
  border:none;
  border-bottom:2px solid var(--gold);
  background:rgba(255,255,255,.04);
  color:var(--cream);
  text-align:center;
  font-size:1rem;
  outline:none;
  transition:border-color .25s ease, background .25s ease;
}
.wish-input::placeholder{ color:rgba(243,236,224,.4); }
.wish-input:focus{ border-color:var(--gold-light); background:rgba(201,164,92,.08); }

.wish-btn{
  background:linear-gradient(135deg, var(--wine), var(--wine-bright));
  color:var(--gold-light);
  border:1px solid rgba(201,164,92,.5);
  padding:12px 30px;
  font-weight:700;
  font-size:.95rem;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:0 6px 24px rgba(92,15,26,.4);
  transition:transform .2s ease, box-shadow .2s ease;
}
.wish-btn:active{ transform:scale(.96); }

#cakeStage{ display:none; opacity:0; transition:opacity .5s ease; touch-action:manipulation; }
#cakeStage.substage-show{ opacity:1; }

.cake-3d-wrapper{ perspective:1000px; }
.cake-3d-inner{
  width:min(66vw, 260px);
  transform-style:preserve-3d;
  transform:rotateY(-70deg) translateZ(-260px) scale(.5);
  opacity:0;
  transition:transform 1.15s cubic-bezier(.16,.84,.44,1), opacity 1.15s ease;
}
.cake-3d-inner.cake-in{ transform:rotateY(0) translateZ(0) scale(1); opacity:1; }
.cake-svg{ width:100%; height:auto; display:block; }

.flame{
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:flicker 1.7s ease-in-out infinite;
}
@keyframes flicker{
  0%,100%{ transform:scale(1,1) rotate(0deg); }
  30%{ transform:scale(.9,1.1) rotate(-4deg); }
  60%{ transform:scale(1.08,.92) rotate(3deg); }
  80%{ transform:scale(.95,1.05) rotate(-2deg); }
}
.flame.out{
  animation:none;
  opacity:0;
  transform:scale(.15,.15) translateY(3px);
  transition:opacity .35s ease, transform .35s ease;
}

.cake-instruction{
  font-size:1.05rem;
  color:rgba(243,236,224,.9);
  text-shadow:0 2px 12px rgba(0,0,0,.9);
  margin-top:22px;
  text-align:center;
  min-height:1.6em;
  opacity:1;
  transition:opacity .35s ease, color .4s ease;
}
.cake-instruction.lit{ color:var(--gold-light); }

.smoke-particle{
  position:fixed;
  width:9px; height:9px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(210,205,198,.6), rgba(210,205,198,0) 70%);
  filter:blur(1.5px);
  pointer-events:none;
  opacity:.85;
  transform:translate(-50%,-50%) scale(.6);
  z-index:50;
}
.smoke-particle.rise{
  transition:transform 1.5s ease-out, opacity 1.5s ease-out;
  transform:translate(calc(-50% + var(--sx,0px)), -120px) scale(2);
  opacity:0;
}

@media (prefers-reduced-motion: reduce){
  .flame{ animation:none; }
  #stagesTrack, #introScreen, #wishStage, #cakeStage, .cake-3d-inner, .smoke-particle{ transition-duration:.05s !important; }
}

@media (min-width:640px){
  .intro-card{ padding:56px 46px; }
}
</style>
</head>
<body>

<div class="intro-card-wrap" id="introScreen">
  <video id="welcomeVideo" playsinline preload="auto">
    <source src="welcome.mp4" type="video/mp4">
  </video>
  <div class="candle-spotlight" id="candleSpotlight"></div>
  <button type="button" class="candle-tap-btn" id="candleTapBtn" aria-label="أشعل الشمعة" tabindex="-1"></button>
  <div class="intro-card" id="introCard">
    <h1 class="intro-title" dir="ltr">Layla's Birthday<br>Edition</h1>
    <button type="button" class="start-btn" id="startBtn">
      <span dir="ltr">Start Experience</span><span class="divider">/</span><span dir="rtl">اضغط للبدء</span>
    </button>
  </div>
</div>

<!-- STAGE 2: WISH INPUT — appears directly after the welcome video, before the celebration fork -->
<div class="wish-stage-wrap" id="wishStageWrap">
  <div class="substage" id="wishStage">
    <p class="instruction-text wish-instruction">قبل ما نكمل... شنو تتمنّي؟ 🕯️</p>
    <form class="wish-form" id="wishForm">
      <input type="text" id="wishInput" class="wish-input" placeholder="اكتبي أمنيتك هنا..." aria-label="اكتبي أمنيتك هنا" autocomplete="off">
      <button type="submit" class="wish-btn" id="wishSubmitBtn">تأكيد الأمنية ✨</button>
    </form>
    <p class="wish-sent-msg" id="wishSentMsg"></p>

var audioCtx = null, masterGain = null, ambientStarted = false, chordStep = 0;

function ensureAudioContext(){

    masterGain.gain.value = 1;
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  return audioCtx;
}

function playPadNote(freq, startTime, duration){
  var osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;
  var shimmer = audioCtx.createOscillator();
  shimmer.type = 'triangle';
  shimmer.frequency.value = freq * 2;
  var shimmerGain = audioCtx.createGain();
  shimmerGain.gain.value = 0.035;
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, startTime);
  g.gain.exponentialRampToValueAtTime(0.11, startTime + 1.4);
  g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  var filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1100;
  osc.connect(g);
  shimmer.connect(shimmerGain); shimmerGain.connect(g);
  g.connect(filter); filter.connect(masterGain);
  osc.start(startTime); osc.stop(startTime + duration + 0.2);
  shimmer.start(startTime); shimmer.stop(startTime + duration + 0.2);
}

var ambientChords = [
  [220.00, 261.63, 329.63, 392.00],
  [174.61, 220.00, 261.63, 349.23],
  [261.63, 329.63, 392.00, 493.88],
  [164.81, 196.00, 246.94, 329.63]
];
var ambientTimeoutId = null;
function scheduleAmbient(){
  var now = audioCtx.currentTime;
  var chord = ambientChords[chordStep % ambientChords.length];
  chord.forEach(function(freq, i){ playPadNote(freq, now + i * 0.18, 4.6); });
  chordStep++;
  ambientTimeoutId = setTimeout(scheduleAmbient, 4200);
}
function startGeneratedAmbient(){
  if(ambientStarted) return;
  ambientStarted = true;
  ensureAudioContext();
  scheduleAmbient();
}
function stopGeneratedAmbient(fadeSeconds){
  if(!ambientStarted) return;
  ambientStarted = false;
  if(ambientTimeoutId){ clearTimeout(ambientTimeoutId); ambientTimeoutId = null; }
  if(masterGain && audioCtx){
    var now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0.0001, now + (fadeSeconds || 0.9));
  }
}

function unlockAudio(){
  ensureAudioContext();
  startLoopMusic();
}

/* ---------- wish/fork background loop (Web Audio, gapless) ----------
   The old <audio loop> element re-seeks to 0 every repeat, which exposes
   a small but audible click/gap at the seam (from MP3 encoder padding +
   the seek itself). A Web Audio buffer source loops sample-accurately,
   so this removes that click entirely. */
var loopBuffer = null, loopBufferPromise = null, loopSource = null, loopGainNode = null;

function fetchLoopBuffer(){
  if(loopBufferPromise) return loopBufferPromise;
  loopBufferPromise = fetch('wish-loop.mp3')
    .then(function(r){ return r.arrayBuffer(); })
    .then(function(ab){ return audioCtx.decodeAudioData(ab); })
    .then(function(buf){ loopBuffer = buf; return buf; });
  return loopBufferPromise;
}

function startLoopMusic(){
  if(!loopGainNode){
    loopGainNode = audioCtx.createGain();
    loopGainNode.gain.value = 1;
    loopGainNode.connect(audioCtx.destination);
  }
  fetchLoopBuffer().then(function(buf){
    if(loopSource) return; // already started — avoid double-triggering on a race
    loopSource = audioCtx.createBufferSource();
    loopSource.buffer = buf;
    loopSource.loop = true;
    loopSource.connect(loopGainNode);
    loopSource.start(0);
  }).catch(function(){
    startGeneratedAmbient(); // file missing/undecodable — fall back to the generated pad
  });
}

function stopLoopMusicHard(){
  if(loopSource){ try{ loopSource.stop(); }catch(e){} loopSource = null; }
}

/* Fades the loop out from whatever point it happens to be at when called —
   we never know how fast she'll move through the wish/fork stages. The
   next stage's own audio fades IN separately (handled on that stage's side)
   so the handoff feels smooth either way. */
function fadeOutBgMusic(durationMs){
  durationMs = durationMs || 900;
  if(loopGainNode && audioCtx){
    var now = audioCtx.currentTime;
    loopGainNode.gain.cancelScheduledValues(now);
    loopGainNode.gain.setValueAtTime(loopGainNode.gain.value, now);
    loopGainNode.gain.linearRampToValueAtTime(0.0001, now + durationMs / 1000);
  }
  stopGeneratedAmbient(durationMs / 1000);
  setTimeout(stopLoopMusicHard, durationMs + 50); // nothing lingers once the fade finishes
}

var candleTapBtn = document.getElementById('candleTapBtn');

/* Builds the glowing "dial" glyph (rings + tick marks + dots + warm core)

function buildDialSvgMarkup(){
  var ticks = '';
  for(var i = 0; i < 12; i++){
    var a = i * 30 * Math.PI / 180;
    var x1 = (50 + 39 * Math.cos(a)).toFixed(1), y1 = (50 + 39 * Math.sin(a)).toFixed(1);
    var x2 = (50 + 46 * Math.cos(a)).toFixed(1), y2 = (50 + 46 * Math.sin(a)).toFixed(1);
    ticks += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="rgba(255,232,190,.85)" stroke-width="1.6" stroke-linecap="round"/>';
  }
  var dots = '';
  for(var j = 0; j < 20; j++){
    var b = j * 18 * Math.PI / 180;
    var dx = (50 + 30 * Math.cos(b)).toFixed(1), dy = (50 + 30 * Math.sin(b)).toFixed(1);
    dots += '<circle cx="'+dx+'" cy="'+dy+'" r="1.1" fill="rgba(255,225,175,.85)"/>';
  }
  return '<svg class="dial-svg" viewBox="0 0 100 100" aria-hidden="true">' +
      '<defs><radialGradient id="dialCore" cx="50%" cy="45%" r="55%">' +
        '<stop offset="0%" stop-color="#fffdf6"/>' +
        '<stop offset="35%" stop-color="#ffe6ad"/>' +
        '<stop offset="70%" stop-color="#ffb35c" stop-opacity=".55"/>' +
        '<stop offset="100%" stop-color="#ffb35c" stop-opacity="0"/>' +
      '</radialGradient></defs>' +
      '<circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,225,170,.55)" stroke-width="1"/>' +
      '<circle cx="50" cy="50" r="34" fill="none" stroke="rgba(255,225,170,.35)" stroke-width="1"/>' +
      ticks + dots +
      '<circle cx="50" cy="50" r="26" fill="url(#dialCore)"/>' +
    '</svg>';
}
candleTapBtn.innerHTML = buildDialSvgMarkup();


/* fx/fy = the exact spot in the SOURCE video frame (0-1 fractions) to sit the button on,
   measured directly off the frame at each checkpoint's own timestamp (the hand keeps
   moving, so the anchor has to match THAT instant, not an earlier one):
   candle 1 has no visible hand (the flame flashes in on its own) -> sit on the candle itself.
   candle 2's hand+lighter is on screen well before it strikes -> sit higher, over the top
   of the hand/thumb, per the corrected position marked on the last screenshot. */
var candleCheckpoints = [
  { time: 19.3, fx: 0.208, fy: 0.516, triggered: false }, // just before the off-screen flash lights candle 1 (~19.5-19.6s)
  { time: 24.2, fx: 0.875, fy: 0.563, triggered: false }  // just before the lighter flicks alight on candle 2 (~24.35-24.4s)
];

var activeCandleCheckpoint = null;

/* Maps a point in the source video frame to on-screen px, matching the
   object-fit:cover crop, so the button sits exactly on the candle/hand/spark
   regardless of viewport size/aspect. Generalized so any full-screen cover
   video in the site (welcome video, fireworks video, ...) can reuse it. */
function videoPointToScreenFor(video, fx, fy){
  var vw = video.videoWidth, vh = video.videoHeight;
  var cw = window.innerWidth, ch = window.innerHeight;
  if(!vw || !vh){ return { x: cw * fx, y: ch * fy }; } // metadata not ready yet: rough fallback
  var scale = Math.max(cw / vw, ch / vh);
  var renderedW = vw * scale, renderedH = vh * scale;
  var offsetX = (cw - renderedW) / 2;
  var offsetY = (ch - renderedH) / 2;
  var x = offsetX + fx * renderedW;
  var y = offsetY + fy * renderedH;
  var margin = 40;
  x = clamp(x, margin, cw - margin);
  y = clamp(y, margin, ch - margin);
  return { x: x, y: y };
}
function videoPointToScreen(fx, fy){
  return videoPointToScreenFor(welcomeVideo, fx, fy);
}

function positionCandleBtn(cp){
  var pt = videoPointToScreen(cp.fx, cp.fy);

}

/* requestAnimationFrame gives us a check roughly every frame (far tighter than the
   'timeupdate' event, which mobile browsers can throttle to only a few times a
   second — coarse enough that currentTime can already be past the flash/flame by

function candleFrameTick(){
  if(!welcomeVideo.paused && !welcomeVideo.ended){
    var t = welcomeVideo.currentTime;
    for(var i = 0; i < candleCheckpoints.length; i++){
      var cp = candleCheckpoints[i];

        candleWaiting = true;
        welcomeVideo.pause();
        showCandleTapBtn(cp);
        break;
      }
    }
  }
  requestAnimationFrame(candleFrameTick);

  'hue-rotate(-15deg) saturate(1.7) brightness(.97)',
  'hue-rotate(-45deg) saturate(2.1) brightness(.92)',
  'hue-rotate(300deg) saturate(1.7)'
];
var petalCenterColor = '#e8a23a';

function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }
function lightenHex(hex, amt){
  var r = parseInt(hex.substring(1,3), 16), g = parseInt(hex.substring(3,5), 16), b = parseInt(hex.substring(5,7), 16);
  r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t){ var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

function Particle(x, y){
  this.x = x; this.y = y;
  var angle = Math.random() * Math.PI * 2;
  var dist = 18 + Math.random() * 26;
  this.vx = Math.cos(angle) * dist; this.vy = Math.sin(angle) * dist;
  this.life = 0; this.maxLife = 60 + Math.random() * 30;
  this.r = 1.2 + Math.random() * 1.8;
}
Particle.prototype.update = function(){ this.life++; };
Object.defineProperty(Particle.prototype, 'done', { get: function(){ return this.life >= this.maxLife; } });
Particle.prototype.draw = function(){
  var t = this.life / this.maxLife;
  var ex = this.x + this.vx * t, ey = this.y + this.vy * t;
  ctx.save();
  ctx.globalAlpha = Math.max(0, 1 - t);
  ctx.shadowColor = 'rgba(236,217,168,.9)';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(ex, ey, this.r, 0, Math.PI * 2);
  ctx.fillStyle = '#f0dca0';
  ctx.fill();
  ctx.restore();
};

function Sparkle(){
  this.x = Math.random() * window.innerWidth;
  this.y = Math.random() * window.innerHeight * 0.75;
  this.r = 0.6 + Math.random() * 1.1;
  this.phase = Math.random() * Math.PI * 2;
  this.speed = 0.015 + Math.random() * 0.02;
}
Sparkle.prototype.draw = function(t){
  var alpha = 0.15 + 0.35 * (0.5 + 0.5 * Math.sin(t * this.speed + this.phase));
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#f3ece0';
  ctx.beginPath();
  ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
};
var sparkles = reducedMotion ? [] : (function(){
  var arr = [];
  for(var i = 0; i < 14; i++) arr.push(new Sparkle());
  return arr;
})();
var sparkleFrame = 0;

function Flower(x, y){
  this.x = x;
  var vh = window.innerHeight;
  this.targetY = clamp(y, vh * 0.22, vh * 0.82);
  this.colorIndex = Math.floor(Math.random() * palette.length);
  this.particles = [];
  this.particlesSpawned = false;
  this.grown = false;

  var scaleVal = (0.82 + Math.random() * 0.34).toFixed(2);
  var rotVal = (Math.random() * 12 - 6).toFixed(1);

  this.el = document.createElement('img');
  this.el.src = ROSE_IMG_SRC;
  this.el.alt = '';
  this.el.className = 'roseBloom';
  this.el.style.left = this.x + 'px';
  this.el.style.top = this.targetY + 'px';
  this.el.style.setProperty('--scale', scaleVal);
  this.el.style.setProperty('--rot', rotVal + 'deg');
  this.el.style.filter = paletteFilters[this.colorIndex] + ' drop-shadow(0 0 16px rgba(201,164,92,.55))';
  gardenLayer.appendChild(this.el);

  var self = this;
  if(reducedMotion){
    this.el.style.transition = 'none';
    this.el.classList.add('grown');
    this.onGrown();
  } else {
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ self.el.classList.add('grown'); });
    });
    this.el.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName && e.propertyName.indexOf('transform') === -1) return;
      self.el.removeEventListener('transitionend', onEnd);
      self.onGrown();
    });
  }
}
Flower.prototype.onGrown = function(){
  if(this.grown) return;
  this.grown = true;
  if(!reducedMotion && !this.particlesSpawned){
    this.particlesSpawned = true;
    for(var i = 0; i < 7; i++) this.particles.push(new Particle(this.x, this.targetY));
  }
};
Flower.prototype.update = function(){
  this.particles.forEach(function(p){ p.update(); });
  this.particles = this.particles.filter(function(p){ return !p.done; });
};
Flower.prototype.draw = function(){
  this.particles.forEach(function(p){ p.draw(); });
};

function clearTypewriter(){
  if(activeTypeInterval){ clearInterval(activeTypeInterval); activeTypeInterval = null; }
  if(activeTypeEl){ activeTypeEl.remove(); activeTypeEl = null; }
}
function findClearY(x, y){
  var minDX = 85, minDY = 44, clearY = y, tries = 0, collided = true;
  while(collided && tries < 14){
    collided = false;
    for(var i = 0; i < placedWordPositions.length; i++){
      var p = placedWordPositions[i];
      if(Math.abs(x - p.x) < minDX && Math.abs(clearY - p.y) < minDY){
        clearY = p.y - minDY;
        collided = true;
      }
    }
    tries++;
  }
  return clamp(clearY, window.innerHeight * 0.1, window.innerHeight);
}
function typeGardenText(text, x, y){
  clearTypewriter();
  var el = document.createElement('div');
  el.className = 'tap-text';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  gardenLayer.appendChild(el);
  placedWordPositions.push({ x: x, y: y });
  activeTypeEl = el;
  if(reducedMotion){ el.textContent = text; activeTypeEl = null; return; }
  var i = 0;
  activeTypeInterval = setInterval(function(){
    i++;
    el.textContent = text.slice(0, i);
    if(i >= text.length){ clearInterval(activeTypeInterval); activeTypeInterval = null; activeTypeEl = null; }
  }, 42);
}

function handleGardenTap(e){
  if(gardenLocked || tapCount >= phrases.length) return;
  var x = clamp(e.clientX, window.innerWidth * 0.14, window.innerWidth * 0.86);
  var y = clamp(e.clientY, window.innerHeight * 0.2, window.innerHeight * 0.8);
  flowers.push(new Flower(x, y));
  var labelY = findClearY(x, y - 28);
  typeGardenText(phrases[tapCount], x, labelY);
  tapCount++;
  if(tapCount >= phrases.length){
    gardenLocked = true;
    setTimeout(goToStage3, 2500);
  }
}
stage2.addEventListener('pointerdown', handleGardenTap);

function renderGarden(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  sparkleFrame++;
  sparkles.forEach(function(s){ s.draw(sparkleFrame); });
  flowers.forEach(function(f){ f.update(); f.draw(); });
  requestAnimationFrame(renderGarden);
}
renderGarden();

function goToStage3(){
  clearTypewriter();
  stagesTrack.classList.add('to-stage3');
}

/* ================= STAGE 5a: FIREWORK LAUNCH MINI-SCENE =================
   She swipes/taps the single glowing rocket to launch it — no PNG assets,
   drawn entirely as SVG/CSS. It flies up on a sine-wave path (like it's
   being steered), accelerating and shrinking into the distance, trailing a
   white meteor streak, and arrives right where the video's own burst opens —
   so it reads as her having launched it herself. */
var launchFireworkEl = document.getElementById('launchFirework');
var launchPointerDown = false;

function playLaunchWhoosh(){
  ensureAudioContext();
  var now = audioCtx.currentTime;
  var noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
  var data = noiseBuffer.getChannelData(0);
  for(var i = 0; i < data.length; i++){ data[i] = (Math.random() * 2 - 1); }
  var noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuffer;
  var filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(700, now);
  filter.frequency.exponentialRampToValueAtTime(4200, now + 0.9);
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(0.32, now + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 1.0);
  noise.connect(filter);
  filter.connect(g);
  g.connect(audioCtx.destination);
  noise.start(now);
  noise.stop(now + 1.0);
}

function spawnSparkBurst(x, y){
  var n = 12;
  for(var i = 0; i < n; i++){
    var el = document.createElement('div');
    el.className = 'launch-spark-burst';
    var angle = (Math.PI * 2 * i / n) + (Math.random() * 0.4 - 0.2);
    var dist = 40 + Math.random() * 32;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    el.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
    launchStageWrap.appendChild(el);
    (function(node){ setTimeout(function(){ node.remove(); }, 600); })(el);
  }
}

function spawnMeteorTrailDot(x, y, scale){
  var el = document.createElement('div');
  el.className = 'meteor-trail-dot';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.transform = 'translate(-50%,-50%) scale(' + Math.max(scale, 0.25) + ')';
  launchStageWrap.appendChild(el);
  setTimeout(function(){ el.remove(); }, 420);
}

function animateFireworkFlight(el){
  var startRect = el.getBoundingClientRect();
  var startX = startRect.left + startRect.width / 2;
  var startY = startRect.top + startRect.height / 2;
  // where the video's own first burst opens — she "carries" it there herself
  var targetX = window.innerWidth * 0.55;
  var targetY = window.innerHeight * 0.30;
  var amplitude = window.innerWidth * 0.11;
  var wiggles = 2.3; // full sine oscillations across the flight
  var duration = 1300; // ms
  var startTime = null;
  var lastTrail = 0;

  el.classList.add('flying');
  el.style.left = startX + 'px';
  el.style.top = startY + 'px';

  function frame(ts){
    if(!startTime) startTime = ts;
    var elapsed = ts - startTime;
    var p = Math.min(1, elapsed / duration);
    var easeP = p * p; // quadratic ease-in = accelerating speed, the "سرعة" effect
    var x = startX + (targetX - startX) * easeP + Math.sin(easeP * Math.PI * wiggles) * amplitude * (1 - easeP * 0.7);
    var y = startY + (targetY - startY) * easeP;
    var scale = Math.max(0.12, 1 - easeP * 0.85); // shrinks as it climbs into the distance

    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';

    if(elapsed - lastTrail > 24){
      lastTrail = elapsed;
      spawnMeteorTrailDot(x, y, scale);
    }

    if(p < 1){
      requestAnimationFrame(frame);
    }else{
      spawnSparkBurst(x, y);
      el.style.opacity = '0';
      launchStageWrap.classList.add('all-launched');
      setTimeout(goToFireworksStage, 220);
    }
  }
  requestAnimationFrame(frame);
}

function launchFirework(el){
  if(el.dataset.launched === '1') return;
  el.dataset.launched = '1';
  playLaunchWhoosh();
  animateFireworkFlight(el);
}

function tryLaunchAt(clientX, clientY){
  if(launchFireworkEl.dataset.launched === '1') return;
  var rect = launchFireworkEl.getBoundingClientRect();
  var pad = 16; // a little forgiveness so the swipe doesn't need to be pixel-perfect
  if(clientX >= rect.left - pad && clientX <= rect.right + pad &&
     clientY >= rect.top - pad && clientY <= rect.bottom + pad){
    launchFirework(launchFireworkEl);
  }
}

launchStageWrap.addEventListener('pointerdown', function(e){
  launchPointerDown = true;
  tryLaunchAt(e.clientX, e.clientY);
});
launchStageWrap.addEventListener('pointermove', function(e){
  if(!launchPointerDown) return;
  tryLaunchAt(e.clientX, e.clientY);
});
window.addEventListener('pointerup', function(){ launchPointerDown = false; });
window.addEventListener('pointercancel', function(){ launchPointerDown = false; });

/* ================= STAGE 3B: CAKE ================= */
var micStream = null, micRAF = null, candlesExtinguished = false;

function setupMicBlowDetection(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    if(candlesExtinguished){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
    micStream = stream;
    ensureAudioContext();
    var source = audioCtx.createMediaStreamSource(stream);
    var analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.55;
    source.connect(analyser);
    var data = new Uint8Array(analyser.frequencyBinCount);
    var loud = 0;
    (function check(){
      if(candlesExtinguished) return;
      analyser.getByteFrequencyData(data);
      var sum = 0;
      for(var i = 0; i < data.length; i++) sum += data[i];
      var avg = sum / data.length;
      if(avg > 30){ loud++; } else { loud = Math.max(0, loud - 1); }
      if(loud > 7){ extinguishCandles(); return; }
      micRAF = requestAnimationFrame(check);
    })();
  }).catch(function(){ /* mic denied or unsupported (e.g. iOS Safari) — tap fallback still works */ });
}

cakeStage.addEventListener('pointerdown', extinguishCandles);

function spawnSmoke(flameEl){
  var rect = flameEl.getBoundingClientRect();
  var count = reducedMotion ? 0 : 4;
  for(var i = 0; i < count; i++){
    var s = document.createElement('div');
    s.className = 'smoke-particle';
    s.style.left = (rect.left + rect.width / 2) + 'px';
    s.style.top = rect.top + 'px';
    s.style.setProperty('--sx', (Math.random() * 30 - 15) + 'px');
    document.body.appendChild(s);
    requestAnimationFrame(function(el){ return function(){ el.classList.add('rise'); }; }(s));
    setTimeout(function(el){ return function(){ el.remove(); }; }(s), 1700);
  }
}

function extinguishCandles(){
  if(candlesExtinguished) return;
  candlesExtinguished = true;
  if(micRAF) cancelAnimationFrame(micRAF);
  if(micStream) micStream.getTracks().forEach(function(t){ t.stop(); });

  var flames = document.querySelectorAll('.flame');
  flames.forEach(function(flame, i){
    setTimeout(function(){
      flame.classList.add('out');
      spawnSmoke(flame);
    }, i * 90);
  });

  setTimeout(function(){
    cakeInstruction.style.opacity = '0';
    setTimeout(function(){
      cakeInstruction.textContent = 'كل عام وأنتِ بخير وسعادة يا Layla! 🎉❤️';
      cakeInstruction.classList.add('lit');
      cakeInstruction.style.opacity = '1';
    }, 350);
    fireConfetti();
  }, 650);
}

function fireConfetti(){
  if(typeof confetti !== 'function') return;
  var colors = ['#c9a45c', '#ecd9a8', '#8a1a2b', '#f3ece0'];
  var base = { colors: colors, disableForReducedMotion: true };
  confetti(Object.assign({ particleCount:130, spread:100, origin:{ y:0.6 }, scalar:1.1 }, base));
  setTimeout(function(){ confetti(Object.assign({ particleCount:55, angle:60, spread:65, origin:{ x:0 } }, base)); }, 200);
  setTimeout(function(){ confetti(Object.assign({ particleCount:55, angle:120, spread:65, origin:{ x:1 } }, base)); }, 200);
  setTimeout(function(){ confetti(Object.assign({ particleCount:80, spread:130, startVelocity:52, origin:{ y:0.4 } }, base)); }, 450);
}

})();
